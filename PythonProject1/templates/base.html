
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Nexora{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='scc/main.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Шапка сайта -->
    <header class="logo">

        <!-- Иконка и название -->
        <div class="brand">
            <img
                src="{{ url_for('static', filename='nexora-icon.png') }}"
                alt="Nexora"
                class="logo-icon"
            >
            <span>Nexora</span>
        </div>

        <!-- Навигация по центру -->
        <nav>
            <a href="/">главная страница</a>
            <a href="/about">про нас</a>
            <a href="/profile">профиль</a>
        </nav>

    </header>

    <!-- Содержимое отдельных страниц -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>

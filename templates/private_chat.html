{% extends "base.html" %}

{% block title %}Личный чат — Nexora Assist{% endblock %}

{% block content %}
<style>
.private-chat {
    max-width: 800px;
    margin: 40px auto;
    padding: 24px;
    color: #edf0ff;
    background: #1c213b;
    border: 1px solid #343b5d;
    border-radius: 18px;
}

.private-chat h1 {
    margin-top: 0;
}

.chat-messages {
    height: 400px;
    overflow-y: auto;
    padding: 16px;
    background: #151a30;
    border-radius: 12px;
    margin-bottom: 16px;
}

.chat-message {
    margin-bottom: 16px;
    overflow-wrap: anywhere;
}

.chat-message strong {
    color: #aab5ff;
}

.chat-form {
    display: flex;
    gap: 10px;
}

.chat-form input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #3b4367;
    border-radius: 10px;
    background: #151a30;
    color: white;
    font: inherit;
}

.chat-form button {
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: #596cf2;
    color: white;
    font: inherit;
    cursor: pointer;
}

.chat-form button:hover {
    background: #7181ff;
}

@media (max-width: 600px) {
    .private-chat {
        margin: 20px 12px;
        padding: 16px;
    }

    .chat-form {
        flex-direction: column;
    }
}
</style>

<div class="private-chat">
    <h1>Чат с {{ recipient.username }}</h1>

    <div class="chat-messages">
        {% for message in messages %}
<div class="chat-message">
    <strong>{{ message.sender_username }}</strong>
    <div>{{ message.content }}</div>
</div>
{% else %}
<p>Пока нет сообщений. Напиши первым!</p>
{% endfor %}
    </div>

    <form
        class="chat-form"
        method="POST"
        action="{{ url_for('private_chat', user_id=recipient.id) }}"
    >
        <input
            type="text"
            name="content"
            placeholder="Напиши сообщение..."
            required
            autocomplete="off"
        >
        <button type="submit">Отправить</button>
    </form>
</div>

<script>
const messagesContainer = document.querySelector('.chat-messages');
if (messagesContainer) {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}
</script>
{% endblock %}
